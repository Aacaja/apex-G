name: Build Windows x64

# Manual-only: the repository owner explicitly starts each build from the
# GitHub Actions page. Source pushes and pull requests never build implicitly.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Static source boundary check
        shell: pwsh
        run: |
          $forbidden = 'OpenProcess|ReadProcessMemory|WriteProcessMemory|VirtualAllocEx|CreateRemoteThread|SetWindowsHookEx|SendInput|keybd_event|mouse_event|SetCursorPos|PostMessage|SendMessage|FindWindow|GetWindowThreadProcessId|CreateToolhelp32Snapshot|EnumProcesses|Windows[.]Media[.]Ocr|D3D11|Direct3D|DXGI|Windows[.]Graphics[.]Capture|MediaFoundation|MFCreate|WSAStartup|WinHttp|InternetOpen|obs-websocket'
          $hits = Get-ChildItem src,resources -Recurse -File | Select-String -Pattern $forbidden -CaseSensitive:$false
          if ($hits) {
            $hits | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw 'Forbidden runtime API token found.'
          }
          'FORBIDDEN_API_SCAN_OK runtime_source=src,resources'

      - name: Build tests and Windows GUI with runner MSVC
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (
            echo [ERROR] vswhere.exe not found at "%VSWHERE%"
            exit /b 1
          )
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo [ERROR] Visual Studio with VC.Tools.x86.x64 was not found.
            exit /b 1
          )
          echo VSINSTALL=%VSINSTALL%
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl.exe
          if errorlevel 1 exit /b 1
          where rc.exe
          if errorlevel 1 exit /b 1
          where dumpbin.exe
          if errorlevel 1 exit /b 1
          if not exist build\core mkdir build\core
          cl.exe /nologo /std:c++17 /permissive- /utf-8 /EHsc /O2 /W4 tests\test_arc_core.cpp /Fe:build\core\test_arc_core.exe
          if errorlevel 1 exit /b 1
          build\core\test_arc_core.exe
          if errorlevel 1 exit /b 1
          cl.exe /nologo /std:c++17 /permissive- /utf-8 /EHsc /O2 /W4 tests\baseline_test.cpp /Fe:build\core\baseline_test.exe
          if errorlevel 1 exit /b 1
          build\core\baseline_test.exe
          if errorlevel 1 exit /b 1
          python scripts\verify_docs.py
          if errorlevel 1 exit /b 1
          call build-windows.cmd
          if errorlevel 1 exit /b 1
          dumpbin /imports dist\ApexArcAssist.exe > build\windows\imports.txt
          if errorlevel 1 exit /b 1
          dumpbin /dependents dist\ApexArcAssist.exe > build\windows\dependents.txt
          if errorlevel 1 exit /b 1

      - name: Audit PE imports and create checksums
        shell: pwsh
        run: |
          Get-Content build\windows\imports.txt
          Get-Content build\windows\dependents.txt
          $audit = (Get-Content build\windows\imports.txt,build\windows\dependents.txt -Raw) -join "`n"
          $forbiddenDll = 'd3d(9|10|11|12)?[.]dll|dxgi[.]dll|d2d1[.]dll|mfplat[.]dll|mfreadwrite[.]dll|ws2_32[.]dll|winhttp[.]dll|wininet[.]dll|obs[^ ]*[.]dll'
          if ($audit -match $forbiddenDll) { throw "Forbidden PE dependency: $($Matches[0])" }
          if ($audit -notmatch 'USER32[.]dll') { throw 'USER32.dll import missing.' }
          if ($audit -notmatch 'GDI32[.]dll') { throw 'GDI32.dll import missing.' }
          $hash = (Get-FileHash dist\ApexArcAssist.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ApexArcAssist.exe" | Set-Content -NoNewline dist\ApexArcAssist.exe.sha256
          "PE_IMPORT_SCAN_OK required=USER32.dll,GDI32.dll forbidden_gpu_network_video=none"
          "SHA256=$hash"

      - name: Upload Windows executable and audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: ApexArcAssist-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/ApexArcAssist.exe
            dist/ApexArcAssist.exe.sha256
            build/windows/imports.txt
            build/windows/dependents.txt
            README.md
            GITHUB_ACTIONS_GUIDE.md
            SECURITY_BOUNDARY.md
            PERFORMANCE_TEST.md
            CHANGELOG.md
            docs/
