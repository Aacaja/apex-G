name: Build Windows x64

# Builds on every push to main (and can be re-run manually).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Format check
        shell: pwsh
        run: cargo fmt --check

      - name: Test (portable formula + OCR pipeline)
        shell: pwsh
        run: |
          cargo test --lib
          cargo test --test ocr_test

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: apex-angle-reader
          if-no-files-found: error
          retention-days: 30
          path: |
            target/release/apex-angle-reader.exe
            README.md
